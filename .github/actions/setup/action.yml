name: Set up the workbench
description: Python environment, the Explorer's packages and last built page, and Playwright's headless Chromium shell, on the runner's own Node.js.
runs:
  using: composite
  steps:
    # The runner images carry a Node.js the workbench supports (README.md, Setup), so none is installed: setting one up
    # costs a Windows job several seconds.
    # uv.lock and explorer/package-lock.json stay local, so each run resolves the Python dependencies afresh, and the
    # Explorer's packages are resolved afresh at most once a day on each system.
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        # Downloading the wheels from PyPI takes less time than restoring them from an Actions cache, and saving one.
        enable-cache: false
        # uv's own cache beside the checkout, so it links rather than copies into .venv: on Windows runners the default
        # cache folder is on a slower drive, which makes uv sync several times slower.
        cache-local-path: ${{ runner.temp }}/uv-cache
        # The newest Python the CAD dependencies publish wheels for; a runner's default can be newer.
        python-version: "3.14"
    - run: uv sync
      shell: bash
    - id: versions
      shell: bash
      run: |
        echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
        echo "playwright=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("playwright"))' | tr -d '\r')" >> "$GITHUB_OUTPUT"
        case "$RUNNER_OS" in
          macOS) echo "browsers=$HOME/Library/Caches/ms-playwright" ;;
          Windows) echo "browsers=$LOCALAPPDATA\\ms-playwright" ;;
          *) echo "browsers=$HOME/.cache/ms-playwright" ;;
        esac >> "$GITHUB_OUTPUT"
    # A job that finds no tree from earlier that day installs the packages the manifest allows then; later jobs restore
    # it instead of installing it again. Actions caches are per branch, so a pull request reuses its own tree or main's.
    # No package is built for a Node version, so the key leaves it out.
    - id: packages
      uses: actions/cache@v6
      with:
        path: explorer/node_modules
        key: explorer-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('explorer/package.json') }}-${{ steps.versions.outputs.day }}
    - if: steps.packages.outputs.cache-hit != 'true'
      # No audit or funding requests: CI only needs the packages installed.
      run: npm --prefix explorer install --no-audit --no-fund
      shell: bash
    # The built page, from the last job that built these sources with that day's packages: the build checks the stamp it
    # leaves against its own inputs (explorer/scripts/incremental-build.mjs) and builds again if any differ, so the key
    # only has to name them closely enough to be found.
    - uses: actions/cache@v6
      with:
        path: explorer/dist
        key: explorer-dist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('explorer/package.json') }}-${{ steps.versions.outputs.day }}-${{ hashFiles('explorer/index.html', 'explorer/tsconfig.json', 'explorer/vite.config.ts', 'explorer/src/**', 'explorer/shared/**', 'explorer/tests/*.test.ts') }}
    # The renderer and the browser scenarios launch only the headless shell, and the runner images already carry the
    # libraries it needs on Linux (install-deps adds only fonts there).
    - uses: actions/cache@v6
      with:
        path: ${{ steps.versions.outputs.browsers }}
        key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
    - run: uv run --no-sync python -m playwright install --only-shell chromium
      shell: bash
