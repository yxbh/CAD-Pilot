name: Check

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: cores and bytecode state
        run: |
          uv run --no-sync python -c "import os, sys; print('cores', os.cpu_count(), 'dont_write', sys.dont_write_bytecode, os.environ.get('PYTHONDONTWRITEBYTECODE'))"
          find .venv -name '*.pyc' | wc -l
      - name: cold import build123d (writes bytecode)
        run: time uv run --no-sync python -c "import build123d"
      - name: warm import build123d
        run: |
          time uv run --no-sync python -c "import build123d"
          time uv run --no-sync python -c "import build123d"
      - name: four cold imports at once (fresh venv bytecode removed)
        run: |
          find .venv -name '__pycache__' -type d -prune -exec rm -rf {} +
          time (for i in 1 2 3 4; do uv run --no-sync python -c "import build123d, trimesh, PIL.Image" & done; wait)
      - name: four warm imports at once
        run: time (for i in 1 2 3 4; do uv run --no-sync python -c "import build123d, trimesh, PIL.Image" & done; wait)
      - name: compile all bytecode
        run: |
          find .venv -name '__pycache__' -type d -prune -exec rm -rf {} +
          time uv sync --inexact --compile-bytecode
      - name: warm import closure
        run: |
          find .venv -name '__pycache__' -type d -prune -exec rm -rf {} +
          time uv run --no-sync python -c "import build123d, trimesh, ezdxf, PIL.Image, playwright.sync_api"
      - name: explorer build
        run: time node explorer/scripts/build.mjs
      - name: cache-sized dist
        run: du -sh explorer/dist
