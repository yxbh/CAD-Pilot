name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's run; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Each system runs the Python suites in one job and the Explorer's core and browser tests split by measured time
# across four, so a run takes as long as its slowest job rather than the sum. That is five jobs per system, within
# the five macOS jobs an account may run at once.
jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # exec, so a cancelled run's signal reaches the check runner, which stops its stages and prints their output.
      - run: exec node tools/check.mjs --python
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-python-${{ matrix.os }}
          path: .local/check/
          include-hidden-files: true
          if-no-files-found: ignore

  explorer:
    name: explorer ${{ matrix.shard }}/4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4]  # the 4 in the job name and command below
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          explorer: true
      - run: exec node tools/check.mjs --explorer ${{ matrix.shard }}/4
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-explorer-${{ matrix.shard }}-${{ matrix.os }}
          path: .local/check/
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check branch protection requires: it passes only when every job above passed.
  checks:
    if: always()
    needs: [python, explorer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "python: ${{ needs.python.result }}, explorer: ${{ needs.explorer.result }}"
          test "${{ needs.python.result }}" = success && test "${{ needs.explorer.result }}" = success
