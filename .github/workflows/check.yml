name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push supersedes a pull request's run. Every push to main is checked: each commit gets its own group,
  # because a group keeps only one pending run and a third quick push would otherwise replace the second's.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Each system runs its checks in five jobs: each runs a share of the Python test files and a share of the Explorer's,
# both split by each file's measured time on that system's runners, so a run takes as long as its slowest job rather
# than the sum. Five is as many macOS jobs as an account may run at once.
jobs:
  check:
    name: check ${{ matrix.share }}/5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        share: [1, 2, 3, 4, 5]  # the 5 in the job name and command below
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # exec, so a cancelled run's signal reaches the check runner, which stops its stages and prints their output.
      - run: exec node tools/check.mjs --share ${{ matrix.share }}/5
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs-${{ matrix.share }}-${{ matrix.os }}
          path: .local/check/
          include-hidden-files: true
          if-no-files-found: ignore

  # The one check branch protection requires: it passes only when every job above passed.
  checks:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "check: ${{ needs.check.result }}"
          test "${{ needs.check.result }}" = success
