name: Bench
on: pull_request
jobs:
  bench:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          explorer: true
      - run: uv run --no-sync python tools/experiment/webgl_bench.py
      - run: nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo $NUMBER_OF_PROCESSORS
